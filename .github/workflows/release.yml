name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      tag_sha: ${{ steps.tag_sha.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-edit
        run: cargo install cargo-edit

      - name: Bump version
        id: version
        run: |
          cargo set-version --bump ${{ github.event.inputs.version_type }}
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "new_version=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: v$NEW_VERSION"

      - name: Run tests
        run: cargo test

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake.nix
        run: |
          NEW_VERSION=$(echo "${{ steps.version.outputs.new_version }}" | sed 's/^v//')

          # Update version in flake.nix
          sed -i "s/version = \"[0-9.]\+\"/version = \"$NEW_VERSION\"/" flake.nix

          # Calculate hash for source
          nix flake prefetch --json github:unhappychoice/gitlogue/${{ steps.version.outputs.new_version }} > /tmp/prefetch.json || true

          echo "Version updated in flake.nix to $NEW_VERSION"

      - name: Create temporary tag
        run: |
          git config --local user.email "unhappychoice@gmail.com"
          git config --local user.name "Yuji Ueki"
          git add Cargo.toml Cargo.lock flake.nix
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git tag ${{ steps.version.outputs.new_version }}

      - name: Generate Changelog
        run: |
          chmod +x generate_changelog.sh
          ./generate_changelog.sh

      - name: Commit changelog and push
        run: |
          git add CHANGELOG.md
          git commit --amend --no-edit
          git tag -f ${{ steps.version.outputs.new_version }}
          git push origin main
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Resolve tag commit SHA
        id: tag_sha
        run: |
          TAG_SHA=$(git rev-list -n 1 ${{ steps.version.outputs.new_version }})
          echo "tag_sha=$TAG_SHA" >> $GITHUB_OUTPUT
          echo "Tag commit SHA: $TAG_SHA"

      - name: Extract Release Notes
        id: extract_notes
        run: |
          VERSION=$(echo "${{ steps.version.outputs.new_version }}" | sed 's/^v//')
          awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "## What's Changed" > release_notes.md
            echo "" >> release_notes.md
            echo "See the full changelog for details." >> release_notes.md
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_version }}
          name: Release ${{ steps.version.outputs.new_version }}
          body: ${{ steps.extract_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build and Upload
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # LoongArch64 (龙芯): cross-compiled on an x86_64 runner with a GNU
          # toolchain, so it links against the same glibc baseline (2.35) as the
          # other Linux artifacts. ubuntu-24.04 is needed because QEMU 8.2 is the
          # first qemu-user-static release that supports loongarch64.
          - target: loongarch64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install LoongArch64 GNU cross toolchain
        if: matrix.target == 'loongarch64-unknown-linux-gnu'
        env:
          CROSS_TOOLCHAIN_PREFIX: loongarch64-linux-gnu
          # Top-level directory created by the tarball below; it is not derived
          # from the target triple, hence the explicit variable.
          CROSS_TOOLCHAIN_TOP: gcc-13.2.0-loongarch64-linux-gnu
          CROSS_TOOLCHAIN_URL: https://github.com/LoongsonLab/oscomp-toolchains-for-oskernel/releases/download/gcc-13.2.0-loongarch64/gcc-13.2.0-loongarch64-linux-gnu.tgz
          CROSS_TOOLCHAIN_SHA256: 1acd6c2ae79d6e8c80ea6d5b20d6ee3d6f52944bc473c833047aa717e05a0380
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/loongarch64-linux-gnu.tgz "$CROSS_TOOLCHAIN_URL"
          echo "${CROSS_TOOLCHAIN_SHA256}  /tmp/loongarch64-linux-gnu.tgz" | sha256sum -c -
          sudo tar -xf /tmp/loongarch64-linux-gnu.tgz -C /opt
          echo "/opt/${CROSS_TOOLCHAIN_TOP}/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          OPENSSL_VENDORED: 1
          # Inert for the other targets, cargo only reads them for this one.
          CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER: loongarch64-linux-gnu-gcc
          CC_loongarch64_unknown_linux_gnu: loongarch64-linux-gnu-gcc
          CXX_loongarch64_unknown_linux_gnu: loongarch64-linux-gnu-g++
          AR_loongarch64_unknown_linux_gnu: loongarch64-linux-gnu-ar
          RANLIB_loongarch64_unknown_linux_gnu: loongarch64-linux-gnu-ranlib
      - name: Smoke test under QEMU (LoongArch64)
        if: matrix.target == 'loongarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          BIN="target/${{ matrix.target }}/release/gitlogue"
          file "$BIN"

          # The binary is dynamically linked, so QEMU has to resolve the emulated
          # loader and every shared object it needs from the cross toolchain rather
          # than from the host. glibc ships inside the toolchain's sysroot, but the
          # GNU runtime libraries (libgcc_s.so.1, which the binary links against for
          # unwinding) are installed next to the compiler instead, so ask the
          # compiler where both groups of libraries live.
          SYSROOT="$(loongarch64-linux-gnu-gcc -print-sysroot)"
          if [ ! -d "$SYSROOT" ]; then
            SYSROOT="/opt/gcc-13.2.0-loongarch64-linux-gnu/sysroot"
          fi
          LIBDIR=""
          for candidate in usr/lib64 lib64 usr/lib lib; do
            if [ -d "$SYSROOT/$candidate" ]; then
              LIBDIR="$SYSROOT/$candidate"
              break
            fi
          done
          if [ -z "$LIBDIR" ]; then
            echo "No libc directory found under $SYSROOT" >&2
            exit 1
          fi

          TOOLCHAIN_ROOT="$(cd "$(dirname "$(command -v loongarch64-linux-gnu-gcc)")/.." && pwd)"
          RUNTIME_DIRS=("$LIBDIR")
          RUNTIME_PATH="$LIBDIR"
          for probe in libgcc_s.so.1 libstdc++.so.6; do
            resolved="$(loongarch64-linux-gnu-gcc -print-file-name="$probe")"
            [ -f "$resolved" ] || continue
            libdir="$(dirname "$resolved")"
            case ":$RUNTIME_PATH:" in
              *":$libdir:"*) ;;
              *)
                RUNTIME_DIRS+=("$libdir")
                RUNTIME_PATH="$RUNTIME_PATH:$libdir"
                ;;
            esac
          done
          echo "sysroot=$SYSROOT libdir=$LIBDIR runtime_path=$RUNTIME_PATH"
          readelf -l "$BIN" | grep INTERP || true

          # This toolchain installs glibc into /usr/lib64, while the executable asks
          # for its loader under /lib64, so build a prefix that mirrors the layout
          # the emulated loader expects. The libraries are copied rather than
          # symlinked so that nothing inside the prefix points back out of it.
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/usr/lib64"
          for dir in lib lib64 usr/lib; do
            ln -s "$STAGE/usr/lib64" "$STAGE/$dir"
          done
          for dir in "${RUNTIME_DIRS[@]}"; do
            find "$dir" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) \
              -exec cp -Lf {} "$STAGE/usr/lib64/" \;
          done

          # Every DT_NEEDED entry has to be resolvable inside the stage; for the ones
          # the runtime directories above do not cover, fall back to a search of the
          # whole toolchain, so a missing library is reported here instead of as a
          # loader error later on.
          readelf -d "$BIN" | awk '/NEEDED/ { gsub(/[][]/, "", $NF); print $NF }' | sort -u |
            while read -r needed; do
              if [ -e "$STAGE/usr/lib64/$needed" ]; then
                continue
              fi
              found="$(find "$TOOLCHAIN_ROOT" "$SYSROOT" -name "$needed" -print -quit 2>/dev/null)"
              if [ -z "$found" ]; then
                echo "No LoongArch64 $needed found anywhere under $TOOLCHAIN_ROOT" >&2
                exit 1
              fi
              echo "staging $needed from $found"
              cp -Lf "$found" "$STAGE/usr/lib64/$needed"
            done

          # QEMU resolves the loader through the staged prefix; LD_LIBRARY_PATH
          # additionally points the emulated loader at the toolchain's runtime
          # directories.
          export QEMU_LD_PREFIX="$STAGE"
          export LD_LIBRARY_PATH="$RUNTIME_PATH"

          qemu-loongarch64-static "$BIN" --version
          # Exercises real code paths (theme registry, config lookup), not just clap.
          qemu-loongarch64-static "$BIN" theme list
      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.tar.gz gitlogue
      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path gitlogue.exe -DestinationPath ../../../gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.zip
      - name: Upload Release Asset (Unix)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.tar.gz
          asset_name: gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: ./gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.zip
          asset_name: gitlogue-${{ needs.release.outputs.new_version }}-${{ matrix.target }}.zip
          asset_content_type: application/zip

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release, build-and-upload]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-flake-hashes:
    name: Update flake.nix Hashes
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Calculate and update hashes
        run: |
          VERSION=${{ needs.release.outputs.new_version }}

          # Ensure we have the latest main
          git pull origin main

          # Calculate source hash
          SRC_HASH=$(nix flake prefetch --json github:unhappychoice/gitlogue/$VERSION 2>/dev/null | jq -r .hash)
          echo "Source hash: $SRC_HASH"

          # Update source hash in flake.nix
          sed -i "s|hash = \"sha256-[A-Za-z0-9+/=]\+\"|hash = \"$SRC_HASH\"|" flake.nix

          # Try to build to get cargoHash (it will fail but show the correct hash)
          nix build .#default 2>&1 | tee /tmp/build.log || true
          CARGO_HASH=$(grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" /tmp/build.log | head -1 || echo "")

          if [ -n "$CARGO_HASH" ]; then
            echo "Cargo hash: $CARGO_HASH"
            sed -i "s|cargoHash = \"sha256-[A-Za-z0-9+/=]\+\"|cargoHash = \"$CARGO_HASH\"|" flake.nix
          else
            echo "Warning: Could not determine cargo hash"
          fi

      - name: Update flake.lock
        run: nix flake lock

      - name: Commit and push changes
        run: |
          VERSION=${{ needs.release.outputs.new_version }}
          git config --local user.email "unhappychoice@gmail.com"
          git config --local user.name "Yuji Ueki"
          git add flake.nix flake.lock
          git commit -m "chore: update flake.nix hashes for $VERSION" || echo "No changes to commit"
          git push origin main

  update-homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [release, build-and-upload]
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: unhappychoice/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        run: |
          set -euo pipefail

          fetch_sha() {
            curl -fsSL --retry 3 --retry-delay 5 "$1" | sha256sum | cut -d' ' -f1
          }

          VERSION=${{ needs.release.outputs.new_version }}

          MACOS_INTEL_URL="https://github.com/unhappychoice/gitlogue/releases/download/$VERSION/gitlogue-$VERSION-x86_64-apple-darwin.tar.gz"
          MACOS_INTEL_SHA=$(fetch_sha "$MACOS_INTEL_URL")

          MACOS_ARM_URL="https://github.com/unhappychoice/gitlogue/releases/download/$VERSION/gitlogue-$VERSION-aarch64-apple-darwin.tar.gz"
          MACOS_ARM_SHA=$(fetch_sha "$MACOS_ARM_URL")

          LINUX_INTEL_URL="https://github.com/unhappychoice/gitlogue/releases/download/$VERSION/gitlogue-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
          LINUX_INTEL_SHA=$(fetch_sha "$LINUX_INTEL_URL")

          LINUX_ARM_URL="https://github.com/unhappychoice/gitlogue/releases/download/$VERSION/gitlogue-$VERSION-aarch64-unknown-linux-gnu.tar.gz"
          LINUX_ARM_SHA=$(fetch_sha "$LINUX_ARM_URL")

          echo "Calculated SHAs:"
          echo "macOS Intel: $MACOS_INTEL_SHA"
          echo "macOS ARM: $MACOS_ARM_SHA"
          echo "Linux Intel: $LINUX_INTEL_SHA"
          echo "Linux ARM: $LINUX_ARM_SHA"

          cd homebrew-tap

          sed -i "s|https://github.com/unhappychoice/gitlogue/releases/download/v[0-9.]\+/gitlogue-v[0-9.]\+-x86_64-apple-darwin.tar.gz|$MACOS_INTEL_URL|g" Formula/gitlogue.rb
          sed -i "s|https://github.com/unhappychoice/gitlogue/releases/download/v[0-9.]\+/gitlogue-v[0-9.]\+-aarch64-apple-darwin.tar.gz|$MACOS_ARM_URL|g" Formula/gitlogue.rb
          sed -i "s|https://github.com/unhappychoice/gitlogue/releases/download/v[0-9.]\+/gitlogue-v[0-9.]\+-x86_64-unknown-linux-gnu.tar.gz|$LINUX_INTEL_URL|g" Formula/gitlogue.rb
          sed -i "s|https://github.com/unhappychoice/gitlogue/releases/download/v[0-9.]\+/gitlogue-v[0-9.]\+-aarch64-unknown-linux-gnu.tar.gz|$LINUX_ARM_URL|g" Formula/gitlogue.rb

          FIRST_SHA_LINE=$(grep -n 'sha256 "' Formula/gitlogue.rb | head -1 | cut -d: -f1)
          sed -i "${FIRST_SHA_LINE}s/sha256 \"[a-f0-9]\+\"/sha256 \"$MACOS_INTEL_SHA\"/" Formula/gitlogue.rb

          SECOND_SHA_LINE=$(grep -n 'sha256 "' Formula/gitlogue.rb | head -2 | tail -1 | cut -d: -f1)
          sed -i "${SECOND_SHA_LINE}s/sha256 \"[a-f0-9]\+\"/sha256 \"$MACOS_ARM_SHA\"/" Formula/gitlogue.rb

          THIRD_SHA_LINE=$(grep -n 'sha256 "' Formula/gitlogue.rb | head -3 | tail -1 | cut -d: -f1)
          sed -i "${THIRD_SHA_LINE}s/sha256 \"[a-f0-9]\+\"/sha256 \"$LINUX_INTEL_SHA\"/" Formula/gitlogue.rb

          FOURTH_SHA_LINE=$(grep -n 'sha256 "' Formula/gitlogue.rb | head -4 | tail -1 | cut -d: -f1)
          sed -i "${FOURTH_SHA_LINE}s/sha256 \"[a-f0-9]\+\"/sha256 \"$LINUX_ARM_SHA\"/" Formula/gitlogue.rb

          git config --local user.email "unhappychoice@gmail.com"
          git config --local user.name "Yuji Ueki"
          git add Formula/gitlogue.rb
          git commit -m "chore: update gitlogue to $VERSION"
          git push
